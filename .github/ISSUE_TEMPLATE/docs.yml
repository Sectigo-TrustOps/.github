name: Documentation problem
description: Report a missing, incorrect, confusing, or broken documentation path.
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or route
      placeholder: https://sectigo-trustops.github.io/docs/...
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task you were trying to complete
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What blocked or confused you
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would make the path complete
