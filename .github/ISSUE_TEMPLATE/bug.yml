name: Bug report
description: Report reproducible incorrect behavior without including secrets.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private keys, tenant identifiers, or sensitive topology. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.4.0 or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Linux
        - macOS
        - Windows
        - Container
        - Browser lab
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include redacted output and stable error codes when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Prefer a mock, no-account lab, or synthetic fixture.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification already attempted
      description: List commands and test results.
